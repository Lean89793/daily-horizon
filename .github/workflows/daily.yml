name: Daily Horizon

on:
  schedule:
    # GitHub Actions 用 UTC 时间；以下对应北京时间 08:00 与 20:00
    - cron: "0 0 * * *"
    - cron: "0 12 * * *"
  workflow_dispatch:
    inputs:
      slot:
        description: "场次（auto 按当前时间判断）"
        type: choice
        default: auto
        options: [auto, morning, evening]
      force:
        description: "已生成也重跑（手动补发）"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: daily-horizon
  cancel-in-progress: false

jobs:
  pack:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 生成并推送学习包
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
          PANEL_URL: ${{ vars.PANEL_URL }}
        run: |
          ARGS=""
          if [ "${{ github.event.inputs.slot }}" = "morning" ] || [ "${{ github.event.inputs.slot }}" = "evening" ]; then
            ARGS="--slot ${{ github.event.inputs.slot }}"
          fi
          if [ "${{ github.event.inputs.force }}" = "true" ]; then
            ARGS="$ARGS --force"
          fi
          echo "run: python main.py $ARGS"
          python main.py $ARGS

      - name: 回写状态与面板
        if: always()
        run: |
          git config user.name "Daily Horizon Bot"
          git config user.email "bot@users.noreply.github.com"
          git add -A data docs
          if git diff --cached --quiet; then
            echo "没有需要提交的变更"
            exit 0
          fi
          git commit -m "chore: update pack $(date -u '+%Y-%m-%d %H:%M UTC')"
          git pull --rebase --autostash origin "${GITHUB_REF_NAME}" || true
          git push
